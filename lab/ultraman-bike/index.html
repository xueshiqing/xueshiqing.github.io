<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>奥特曼：光之战士 · ULTRA GUARDIAN</title>
<meta name="description" content="二维横版弹幕动作游戏：奥特曼大战怪兽，五关不同场景与 BOSS，支持键盘与触屏操作。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/game.css">
</head>
<body>
<div id="app">

  <canvas id="game" width="640" height="360"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hud" hidden>
    <div class="hud-left">
      <div class="timer" id="timer">
        <svg class="timer-svg" viewBox="0 0 44 44" aria-hidden="true">
          <circle class="timer-track" cx="22" cy="22" r="18"/>
          <circle class="timer-progress" id="timerProgress" cx="22" cy="22" r="18"/>
        </svg>
        <div class="timer-core" id="timerCore"></div>
      </div>
      <div class="hud-info">
        <div class="hud-level" id="hudLevel">第一关 · 城市废墟</div>
        <div class="hud-hp" id="hudHp">100 / 100</div>
        <div class="hud-stamina" id="staminaBar" title="体力：普通攻击命中积攒，满格可发射斯派修姆光线">
          <i id="staminaFill"></i>
        </div>
      </div>
    </div>
    <div class="hud-right">
      <div class="hud-stat"><span class="k">复活</span><b id="hudRevive">0</b></div>
      <div class="hud-stat"><span class="k">得分</span><b id="hudScore">0</b></div>
    </div>
  </div>

  <!-- ============ 触屏控制 ============
       左下 / 右下各一块四等分扇形触控区：以圆心算角度判定扇区，沿半径方向
       无限延展，扇形内外任意位置按下都会触发对应操作。
       只画内部四条分隔线（径向渐变到边缘淡出），不画外圈，尽量减少遮挡。 -->
  <div id="touch" class="touch" hidden>

    <div class="pad pad--move" id="padMove">
      <svg class="pad-svg" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="fadeMove" cx="100" cy="100" r="96" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#a9d4ff" stop-opacity=".28"/>
            <stop offset="40%"  stop-color="#a9d4ff" stop-opacity=".13"/>
            <stop offset="78%"  stop-color="#a9d4ff" stop-opacity=".03"/>
            <stop offset="100%" stop-color="#a9d4ff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path class="sec" data-key="up"    d="M100,100 L32.1,32.1   A96,96 0 0 1 167.9,32.1   Z"/>
        <path class="sec" data-key="right" d="M100,100 L167.9,32.1   A96,96 0 0 1 167.9,167.9  Z"/>
        <path class="sec" data-key="down"  d="M100,100 L167.9,167.9  A96,96 0 0 1 32.1,167.9   Z"/>
        <path class="sec" data-key="left"  d="M100,100 L32.1,167.9   A96,96 0 0 1 32.1,32.1    Z"/>
        <g class="pad-lines" stroke="url(#fadeMove)">
          <line x1="100" y1="100" x2="32.1"  y2="32.1"/>
          <line x1="100" y1="100" x2="167.9" y2="32.1"/>
          <line x1="100" y1="100" x2="167.9" y2="167.9"/>
          <line x1="100" y1="100" x2="32.1"  y2="167.9"/>
        </g>
        <circle class="pad-dot" cx="100" cy="100" r="3.5"/>
        <text class="pad-lab" data-lab="up"    x="100" y="46">▲</text>
        <text class="pad-lab" data-lab="right" x="152" y="100">▶</text>
        <text class="pad-lab" data-lab="down"  x="100" y="154">▼</text>
        <text class="pad-lab" data-lab="left"  x="48"  y="100">◀</text>
      </svg>
    </div>

    <div class="pad pad--act" id="padAct">
      <svg class="pad-svg" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="fadeAct" cx="100" cy="100" r="96" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#ffe08a" stop-opacity=".28"/>
            <stop offset="40%"  stop-color="#ffe08a" stop-opacity=".13"/>
            <stop offset="78%"  stop-color="#ffe08a" stop-opacity=".03"/>
            <stop offset="100%" stop-color="#ffe08a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path class="sec" data-key="beam" d="M100,100 L32.1,32.1   A96,96 0 0 1 167.9,32.1   Z"/>
        <path class="sec" data-key="fire" d="M100,100 L167.9,32.1   A96,96 0 0 1 167.9,167.9  Z"/>
        <path class="sec" data-key="jump" d="M100,100 L167.9,167.9  A96,96 0 0 1 32.1,167.9   Z"/>
        <path class="sec" data-key="dash" d="M100,100 L32.1,167.9   A96,96 0 0 1 32.1,32.1    Z"/>
        <g class="pad-lines" stroke="url(#fadeAct)">
          <line x1="100" y1="100" x2="32.1"  y2="32.1"/>
          <line x1="100" y1="100" x2="167.9" y2="32.1"/>
          <line x1="100" y1="100" x2="167.9" y2="167.9"/>
          <line x1="100" y1="100" x2="32.1"  y2="167.9"/>
        </g>
        <circle class="pad-dot" cx="100" cy="100" r="3.5"/>
        <text class="pad-lab" data-lab="beam" x="100" y="48">波</text>
        <text class="pad-lab" data-lab="fire" x="150" y="100">攻</text>
        <text class="pad-lab" data-lab="jump" x="100" y="152">跳</text>
        <text class="pad-lab" data-lab="dash" x="50"  y="100">闪</text>
      </svg>
    </div>

  </div>

  <!-- ============ 覆盖层 ============ -->
  <div id="overlay" class="overlay"></div>

  <div id="rotate" class="rotate" hidden>
    <div class="rotate-icon">📱</div>
    <p>请把手机横过来玩</p>
    <span>横屏体验更好</span>
  </div>

</div>

<script src="assets/js/core.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/levels.js"></script>
<script src="assets/js/game.js"></script>
</body>
</html>
