<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>奥特曼：光之战士 · ULTRA GUARDIAN</title>
<meta name="description" content="二维横版弹幕动作游戏：奥特曼大战怪兽，五关不同场景与 BOSS，支持键盘与触屏操作。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/game.css">
</head>
<body>
<div id="app">

  <canvas id="game" width="640" height="360"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hud" hidden>
    <div class="hud-left">
      <div class="timer" id="timer">
        <svg class="timer-svg" viewBox="0 0 44 44" aria-hidden="true">
          <circle class="timer-track" cx="22" cy="22" r="18"/>
          <circle class="timer-progress" id="timerProgress" cx="22" cy="22" r="18"/>
        </svg>
        <div class="timer-core" id="timerCore"></div>
      </div>
      <div class="hud-info">
        <div class="hud-level" id="hudLevel">第一关 · 城市废墟</div>
        <div class="hud-hp" id="hudHp">100 / 100</div>
      </div>
    </div>
    <div class="hud-right">
      <div class="hud-stat"><span class="k">复活</span><b id="hudRevive">0</b></div>
      <div class="hud-stat"><span class="k">得分</span><b id="hudScore">0</b></div>
    </div>
  </div>

  <!-- ============ 触屏控制 ============ -->
  <div id="touch" class="touch" hidden>
    <div class="dpad" id="dpad">
      <button class="dbtn up"    data-key="up"    aria-label="上/跳跃">▲</button>
      <button class="dbtn left"  data-key="left"  aria-label="左">◀</button>
      <button class="dbtn right" data-key="right" aria-label="右">▶</button>
      <button class="dbtn down"  data-key="down"  aria-label="下">▼</button>
      <span class="dpad-hub"></span>
    </div>
    <div class="actions">
      <button class="abtn jump" data-key="jump">跳</button>
      <button class="abtn dash" data-key="dash">闪</button>
      <button class="abtn fire" data-key="fire">攻</button>
      <button class="abtn beam" data-key="beam">波</button>
    </div>
  </div>

  <!-- ============ 覆盖层 ============ -->
  <div id="overlay" class="overlay"></div>

  <div id="rotate" class="rotate" hidden>
    <div class="rotate-icon">📱</div>
    <p>请把手机横过来玩</p>
    <span>横屏体验更好</span>
  </div>

</div>

<script src="assets/js/core.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/levels.js"></script>
<script src="assets/js/game.js"></script>
</body>
</html>
